# Netlify config for The Lattice.
#
# Static HTML/CSS/JS with no build step: Netlify publishes the repo root
# as-is. There is no [build] block and no SPA redirect — this is a single
# index.html with anchor navigation, so a catch-all rewrite would only
# mask real 404s.

[build]
  publish = "."

# The publish directory is the repo root, so anything committed is fetchable.
# tools/ is build tooling, not part of the site — keep it out of the served
# surface rather than relying on nobody guessing the path.
# force = true is required: without it Netlify serves a matching static file
# and never consults the rule, which is exactly the case here.
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
